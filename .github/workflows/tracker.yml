name: CBIT 100% Full-Auto Cloud Event Scanner

on:
  schedule:
    # Runs automatically every 30 minutes 24/7 in the cloud
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub

jobs:
  auto-scan-cbit-clubs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install requests google-genai pillow apify-client

      - name: Run Full-Auto Scanner
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bot/auto_scanner.py
